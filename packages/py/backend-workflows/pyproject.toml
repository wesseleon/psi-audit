[project]
name = "mistralai-capabilities-backend-workflows"
version = "0.1.71"
description = "The workflows capability's toolkit: the SDK execution boundary the app imports (`client`) and the worker's dev loop (`dev`)."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mistralai[workflow-payload-encryption]>=3.6.0",
    "mistralai-workflows>=3.17.1",
    "pydantic>=2.14.1",
    "structlog>=25.5.0",
    "watchfiles>=1.3",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mistralai_capabilities.workflows"
namespace = true
