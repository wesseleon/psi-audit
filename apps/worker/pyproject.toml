[project]
name = "worker"
version = "0.1.0"
description = "psi-audit worker"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28.0",
    "mistralai-capabilities-backend-workflows",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
mistralai-capabilities-backend-workflows = { workspace = true }
